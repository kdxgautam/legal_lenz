
[project]
name = "legal-lenz"
version = "0.1.0"
description = "Controlled Streamlit RAG service for legal PDFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.4.0",
    "google-cloud-storage>=3.6.0",
    "cloud-sql-python-connector[pg8000]>=1.20.0",
    "sqlalchemy>=2.0.45",
    "pymupdf>=1.27.2.3",
    "langchain-text-splitters>=1.0.1",
    "streamlit[auth]>=1.57.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
